apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: shopdemo
  labels:
    app: orders
    app.kubernetes.io/version: "${GIT_SHA}"
  annotations:
    sre-demo.deploy/branch: "${GIT_BRANCH}"
    sre-demo.deploy/commit: "${GIT_SHA}"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
        app.kubernetes.io/version: "${GIT_SHA}"
      annotations:
        sre-demo.deploy/branch: "${GIT_BRANCH}"
        sre-demo.deploy/commit: "${GIT_SHA}"
    spec:
      containers:
        - name: orders
          image: ${ACR_LOGIN_SERVER}/orders:${IMAGE_TAG}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: shopdemo
spec:
  selector:
    app: orders
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orders
  namespace: shopdemo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orders
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
