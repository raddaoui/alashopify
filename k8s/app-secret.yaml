apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: shopdemo
type: Opaque
stringData:
  MYSQL_USER: "shop"
  MYSQL_PASSWORD: "shoppass"
  MYSQL_ROOT_PASSWORD: "rootpass"
  # Paste your Application Insights connection string here (or patch via kubectl).
  # Leave empty to run without telemetry export.
  APPLICATIONINSIGHTS_CONNECTION_STRING: ""
